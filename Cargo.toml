[package]
name = "openocr"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[features]
devtools = ["freya/devtools"]

[dependencies]
image = "0.25.10"
base64 = "0.23.1"
tokio = { version = "1.54.1", features = ["full"] }
rig-core = { version = "0.45.0", features = ["reqwest"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
freya = { version = "0.4.3", features = ["icons-lucide"] }
clap = { version = "4.6.7", features = ["derive"] }
tw-colors = "0.1.0"
uuid = { version = "1.28.0", features = ["v4"] }
dirs = "7.0.0"
anyhow = "1.0.104"
xcap = "0.9.8"
